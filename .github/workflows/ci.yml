name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Protocol, agent and web
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm run build:agent

  database:
    name: Schema and access rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration and policy tests on Postgres
        run: |
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          PG_BIN="$PG_BIN" bash supabase/tests/run-local.sh

  renderer:
    name: Preview renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-thai-tlwg
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
